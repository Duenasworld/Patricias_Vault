<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patricias Passwort Manager</title>
</head>
<body class="bg-dark text-light vh-100 d-flex align-items-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Die Bootstrap-Card für das Formular -->
                <div class="card bg-secondary text-white shadow-lg p-4">
                    <h2 class="card-title text-center mb-4">🔐 Konto erstellen</h2>
                    
                    <form id="registerForm">
                        <!-- Zeile für Vor- und Nachname (Nebeneinander auf Desktop) -->
                        <div class="row g-3 mb-3">
                            <div class="col-12 col-sm-6">
                                <label class="form-label">Vorname *</label>
                                <input type="text" id="firstName" class="form-border form-control" required>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="form-label">Nachname *</label>
                                <input type="text" id="lastName" class="form-control" required>
                            </div>
                        </div>

                        <!-- Optionaler Zweitname -->
                        <div class="mb-3">
                            <label class="form-label">Zweitname (Optional)</label>
                            <input type="text" id="middleName" class="form-control">
                        </div>

                        <!-- Username und E-Mail -->
                        <div class="mb-3">
                            <label class="form-label">Benutzername *</label>
                            <input type="text" id="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">E-Mail-Adresse *</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>

                        <!-- Master-Passwort (aktuell noch im Klartext für das GUI-Skelett) -->
                        <div class="mb-3">
                            <label class="form-label">Master-Passwort *</label>
                            <input type="password" id="password" class="form-control" required>
                        </div>

                        <!-- Optionaler Kommentar -->
                        <div class="mb-4">
                            <label class="form-label">Notiz / Kommentar</label>
                            <textarea id="comment" class="form-control" rows="2"></textarea>
                        </div>

                        <!-- Absendeknopf -->
                        <button type="submit" class="btn btn-warning w-100 fw-bold">Registrieren</button>
                    </form>

                    <!-- Statusmeldung für den Nutzer -->
                    <div id="statusMessage" class="mt-3 alert d-none" role="alert"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Verknüpfung zur Logik-Datei -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
